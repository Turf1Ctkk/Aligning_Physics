hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +simulator=isaacgym
    - +exp=train_delta_a_open_loop
    - +domain_rand=NO_domain_rand
    - +rewards=motion_tracking/delta_a/reward_delta_a_openloop
    - +robot=g1/g1_29dof_anneal_23dof
    - +terrain=terrain_locomotion_plane
    - +obs=delta_a/open_loop
    - num_envs=2048
    - headless=True
    - checkpoint=null
    - auto_load_latest=False
    - use_wandb=False
    - project_name=AligningPhysics
    - experiment_name=controlled_delta
    - experiment_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/models/delta
    - ++env._target_=research.asap_diagnostics.controlled_runtime.WeightedGridDeltaReplay
    - ++env.config.sampling_manifest=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/sampling_manifest.json
    - robot.motion.motion_file=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/datasets/mixed30.pkl
    - ++robot.motion.use_recorded_velocities=True
    - robot.control.stiffness.ankle_pitch=20
    - robot.control.stiffness.ankle_roll=20
    - robot.asset.self_collisions=0
    - env.config.max_episode_length_s=1.0
    - env.config.noise_to_initial_level=0
    - env.config.resample_motion_when_training=True
    - env.config.resample_time_interval_s=10000
    - ++env.config.add_extra_action=True
    - ++env.config.zero_delta_a=False
    - ++env.config.anklePR=True
    - obs.noise_scales.base_pos_z=0.0
    - obs.noise_scales.feet_contact_force=0.0
    - rewards.reward_scales.penalty_minimal_action_norm=-0.1
    - algo.config.init_at_random_ep_len=False
    - algo.config.save_interval=100
    - algo.config.num_learning_iterations=1000
    - seed=20309010
  job:
    name: train_agent
    chdir: false
    override_dirname: ++env._target_=research.asap_diagnostics.controlled_runtime.WeightedGridDeltaReplay,++env.config.add_extra_action=True,++env.config.anklePR=True,++env.config.sampling_manifest=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/sampling_manifest.json,++env.config.zero_delta_a=False,++robot.motion.use_recorded_velocities=True,+domain_rand=NO_domain_rand,+exp=train_delta_a_open_loop,+obs=delta_a/open_loop,+rewards=motion_tracking/delta_a/reward_delta_a_openloop,+robot=g1/g1_29dof_anneal_23dof,+simulator=isaacgym,+terrain=terrain_locomotion_plane,algo.config.init_at_random_ep_len=False,algo.config.num_learning_iterations=1000,algo.config.save_interval=100,auto_load_latest=False,checkpoint=null,env.config.max_episode_length_s=1.0,env.config.noise_to_initial_level=0,env.config.resample_motion_when_training=True,env.config.resample_time_interval_s=10000,experiment_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/models/delta,experiment_name=controlled_delta,headless=True,num_envs=2048,obs.noise_scales.base_pos_z=0.0,obs.noise_scales.feet_contact_force=0.0,project_name=AligningPhysics,rewards.reward_scales.penalty_minimal_action_norm=-0.1,robot.asset.self_collisions=0,robot.control.stiffness.ankle_pitch=20,robot.control.stiffness.ankle_roll=20,robot.motion.motion_file=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/datasets/mixed30.pkl,seed=20309010,use_wandb=False
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.1'
    cwd: /root/ASAP
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/ASAP/humanoidverse/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/models/delta/.hydra
    choices:
      obs: delta_a/open_loop
      terrain: terrain_locomotion_plane
      robot: g1/g1_29dof_anneal_23dof
      rewards: motion_tracking/delta_a/reward_delta_a_openloop
      domain_rand: NO_domain_rand
      exp: train_delta_a_open_loop
      env: delta_a_open_loop
      algo: ppo
      simulator: isaacgym
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
