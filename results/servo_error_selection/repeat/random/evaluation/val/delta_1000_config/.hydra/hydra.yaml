hydra:
  run:
    dir: ${eval_log_dir}
  sweep:
    dir: multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +checkpoint=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/models/delta/model_1000.pt
    - +headless=True
    - +num_envs=60
    - +opt=record
    - ++seed=20309109
    - ++algo._target_=research.asap_diagnostics.dataset_runtime.RolloutRecorderPPO
    - ++env._target_=research.asap_diagnostics.dataset_runtime.GridDeltaReplay
    - ++eval_log_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/evaluation/val/delta_1000_config
    - ++robot.motion.motion_file=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/datasets/val_cases.pkl
    - ++robot.motion.use_recorded_velocities=True
    - ++robot.control.stiffness.ankle_pitch=20
    - ++robot.control.stiffness.ankle_roll=20
    - ++robot.asset.self_collisions=0
    - ++env.config.dataset_evaluation=True
    - ++env.config.add_extra_action=True
    - ++env.config.zero_delta_a=False
    - ++env.config.anklePR=True
    - ++env.config.noise_to_initial_level=0
    - ++env.config.enforce_randomize_motion_start_eval=False
    - ++env.config.save_motion=False
    - ++env.config.resample_motion_when_training=False
    - ++env.config.dataset_record_path=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/evaluation/val/delta_1000.pkl
    - ++env.config.dataset_record_steps=55
  job:
    name: eval_agent
    chdir: null
    override_dirname: ++algo._target_=research.asap_diagnostics.dataset_runtime.RolloutRecorderPPO,++env._target_=research.asap_diagnostics.dataset_runtime.GridDeltaReplay,++env.config.add_extra_action=True,++env.config.anklePR=True,++env.config.dataset_evaluation=True,++env.config.dataset_record_path=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/evaluation/val/delta_1000.pkl,++env.config.dataset_record_steps=55,++env.config.enforce_randomize_motion_start_eval=False,++env.config.noise_to_initial_level=0,++env.config.resample_motion_when_training=False,++env.config.save_motion=False,++env.config.zero_delta_a=False,++eval_log_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/evaluation/val/delta_1000_config,++robot.asset.self_collisions=0,++robot.control.stiffness.ankle_pitch=20,++robot.control.stiffness.ankle_roll=20,++robot.motion.motion_file=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/datasets/val_cases.pkl,++robot.motion.use_recorded_velocities=True,++seed=20309109,+checkpoint=/root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/models/delta/model_1000.pt,+headless=True,+num_envs=60,+opt=record
    id: ???
    num: ???
    config_name: base_eval
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.1'
    cwd: /root/ASAP
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/ASAP/humanoidverse/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/aligning_physics/servo_step_20261009/repeat/random/evaluation/val/delta_1000_config
    choices:
      opt: record
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
