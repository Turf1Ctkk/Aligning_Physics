hydra:
  run:
    dir: ${save_dir}
  sweep:
    dir: ${save_dir}
    subdir: ${hydra.job.num}
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.mode=RUN
    task:
    - +simulator=isaacgym
    - +exp=train_delta_a_closed_loop
    - +domain_rand=NO_domain_rand_finetune_with_deltaA
    - +rewards=motion_tracking/reward_motion_tracking_dm_simfinetuning
    - +robot=g1/g1_29dof_anneal_23dof
    - +terrain=terrain_locomotion_plane
    - +obs=delta_a/train_policy_with_delta_a
    - ++algo._target_=research.asap_diagnostics.controlled_runtime.FreshFineTunePPO
    - ++algo.config.policy_checkpoint=/root/autodl-tmp/aligning_physics/servo_step_20261009/primary/servo/models/delta/model_500.pt
    - checkpoint=/root/ASAP/logs/MotionTracking/20261007_142152-MotionTracking_StepFBL1-motion_tracking-g1_29dof_anneal_23dof/model_6000.pt
    - robot.motion.motion_file=/root/ASAP/humanoidverse/data/motions/g1_29dof_anneal_23dof/TairanTestbed/singles/0-motions_raw_tairantestbed_smpl_video_step_forward_back_level1_filter_amass.pkl
    - num_envs=2048
    - headless=True
    - project_name=AligningPhysics
    - ++experiment_name=servo_step_servo
    - ++experiment_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/primary/servo/models/asap_ft
    - use_wandb=False
    - auto_load_latest=False
    - robot.asset.self_collisions=0
    - robot.control.stiffness.ankle_pitch=20
    - robot.control.stiffness.ankle_roll=20
    - ++env.config.add_extra_action=True
    - ++env.config.anklePR=True
    - env.config.noise_to_initial_level=0.2
    - env.config.resample_motion_when_training=False
    - algo.config.load_optimizer=False
    - algo.config.actor_learning_rate=0.0001
    - algo.config.critic_learning_rate=0.001
    - algo.config.entropy_coef=0.0
    - algo.config.init_at_random_ep_len=False
    - algo.config.save_interval=100
    - algo.config.num_learning_iterations=1000
    - ++seed=20310009
    - rewards.reward_penalty_curriculum=False
    - rewards.reward_initial_penalty_scale=1.0
    - ++obs.noise_scales.base_pos_z=0.0
    - ++obs.noise_scales.feet_contact_force=0.0
    - ++env._target_=research.asap_diagnostics.delta_reset_runtime.ResetSafeDeltaClosedLoop
  job:
    name: train_agent
    chdir: false
    override_dirname: ++algo._target_=research.asap_diagnostics.controlled_runtime.FreshFineTunePPO,++algo.config.policy_checkpoint=/root/autodl-tmp/aligning_physics/servo_step_20261009/primary/servo/models/delta/model_500.pt,++env._target_=research.asap_diagnostics.delta_reset_runtime.ResetSafeDeltaClosedLoop,++env.config.add_extra_action=True,++env.config.anklePR=True,++experiment_dir=/root/autodl-tmp/aligning_physics/servo_step_20261009/primary/servo/models/asap_ft,++experiment_name=servo_step_servo,++obs.noise_scales.base_pos_z=0.0,++obs.noise_scales.feet_contact_force=0.0,++seed=20310009,+domain_rand=NO_domain_rand_finetune_with_deltaA,+exp=train_delta_a_closed_loop,+obs=delta_a/train_policy_with_delta_a,+rewards=motion_tracking/reward_motion_tracking_dm_simfinetuning,+robot=g1/g1_29dof_anneal_23dof,+simulator=isaacgym,+terrain=terrain_locomotion_plane,algo.config.actor_learning_rate=0.0001,algo.config.critic_learning_rate=0.001,algo.config.entropy_coef=0.0,algo.config.init_at_random_ep_len=False,algo.config.load_optimizer=False,algo.config.num_learning_iterations=1000,algo.config.save_interval=100,auto_load_latest=False,checkpoint=/root/ASAP/logs/MotionTracking/20261007_142152-MotionTracking_StepFBL1-motion_tracking-g1_29dof_anneal_23dof/model_6000.pt,env.config.noise_to_initial_level=0.2,env.config.resample_motion_when_training=False,headless=True,num_envs=2048,project_name=AligningPhysics,rewards.reward_initial_penalty_scale=1.0,rewards.reward_penalty_curriculum=False,robot.asset.self_collisions=0,robot.control.stiffness.ankle_pitch=20,robot.control.stiffness.ankle_roll=20,robot.motion.motion_file=/root/ASAP/humanoidverse/data/motions/g1_29dof_anneal_23dof/TairanTestbed/singles/0-motions_raw_tairantestbed_smpl_video_step_forward_back_level1_filter_amass.pkl,use_wandb=False
    id: ???
    num: ???
    config_name: base
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.3.7
    version_base: '1.1'
    cwd: /root/ASAP
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /root/ASAP/humanoidverse/config
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /root/autodl-tmp/aligning_physics/servo_step_20261009/primary/servo/models/asap_ft/.hydra
    choices:
      obs: delta_a/train_policy_with_delta_a
      terrain: terrain_locomotion_plane
      robot: g1/g1_29dof_anneal_23dof
      rewards: motion_tracking/reward_motion_tracking_dm_simfinetuning
      domain_rand: NO_domain_rand_finetune_with_deltaA
      exp: train_delta_a_closed_loop
      env: delta_a_closed_loop
      algo: ppo_train_delta_a
      simulator: isaacgym
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: basic
      hydra/output: default
  verbose: false
